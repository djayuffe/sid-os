<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SID OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-cyan: 34, 211, 238;
        --color-emerald: 16, 185, 129;
        --color-pink: 244, 114, 182;
        --color-amber: 251, 191, 36;
        --glass-bg: rgba(8, 12, 20, 0.7);
        --glass-border: rgba(255, 255, 255, 0.05);
      }
      body {
        background-color: #010204;
        color: #94a3b8;
        font-family: 'Share Tech Mono', monospace;
        overflow: hidden;
        font-size: 10px;
        -webkit-font-smoothing: antialiased;
        image-rendering: pixelated;
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 2px; height: 2px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.2); border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.6); }
      
      .glow-text { text-shadow: 0 0 12px currentColor; }
      .glass { 
        backdrop-filter: blur(12px) saturate(160%); 
        background: var(--glass-bg); 
        border: 1px solid var(--glass-border);
        will-change: transform, opacity;
      }
      .glass-heavy { 
        backdrop-filter: blur(30px) saturate(200%); 
        background: rgba(2, 4, 12, 0.95); 
      }
      
      .silicon-border { position: relative; }
      .silicon-border::after { 
        content: ''; position: absolute; inset: 0; pointer-events: none; 
        border: 1px solid rgba(255,255,255,0.02); border-radius: inherit; 
      }
      
      input[type=range] { -webkit-appearance: none; background: transparent; }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; height: 8px; width: 3px;
        background: #22d3ee; box-shadow: 0 0 6px #22d3ee;
        margin-top: -3px; border-radius: 1px;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%; height: 1.5px; background: #1e293b; border-radius: 1px;
      }

      @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(1000%); } }
      .animate-scanline { animation: scanline 12s linear infinite; }
      
      .window-focus { 
        border-color: rgba(34, 211, 238, 0.4) !important; 
        box-shadow: 0 15px 45px rgba(0,0,0,0.95), 0 0 30px rgba(34,211,238,0.03) !important; 
        z-index: 500 !important; 
      }
      
      .boot-text { text-shadow: 0 0 6px rgba(34, 211, 238, 0.8); }
      .gpu-sync { transform: translateZ(0); }
      
      .pro-text { font-size: 9px; line-height: 1.2; letter-spacing: 0.05em; }
      .pro-label { font-size: 8px; font-weight: 900; letter-spacing: 0.25em; color: #475569; text-transform: uppercase; }

      .grain::before {
        content: "";
        position: fixed;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.015;
        pointer-events: none;
        z-index: 9999;
      }

      .hdr-glow {
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.8), 0 0 20px rgba(34, 211, 238, 0.4);
      }
      .hdr-glow-pink {
        text-shadow: 0 0 10px rgba(244, 114, 182, 0.8), 0 0 20px rgba(244, 114, 182, 0.4);
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react/": "https://esm.sh/react@19.0.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0",
    "three": "https://esm.sh/three@0.173.0",
    "three/": "https://esm.sh/three@0.173.0/"
  }
}
</script>
</head>
  <body class="select-none bg-[#010204] grain">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
